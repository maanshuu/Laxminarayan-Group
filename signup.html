<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laxminarayan Group — Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0b0e;
  --surface: #141418;
  --surface-glass: rgba(20, 20, 26, 0.85);
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.18);
  --gold: #d4af37;
  --gold-glow: rgba(212, 175, 55, 0.35);
  --gold-soft: rgba(212, 175, 55, 0.12);
  --gold-gradient: linear-gradient(135deg, #f3d789 0%, #d4af37 60%, #aa8420 100%);
  --ink: #ffffff;
  --muted: #9c9ca8;
  --subtle: #6a6a78;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-pill: 999px;
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.7);
  --shadow-glow: 0 0 35px var(--gold-glow);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.12) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
  background-attachment: fixed;
  min-height: 100vh;
}

.wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
}

.box {
  width: min(460px, 100%);
  background: var(--surface-glass);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 44px 38px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}

.box::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.logo {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 2.5px;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
  text-transform: uppercase;
}
.gold { color: var(--gold); }

h1 {
  font-family: "Playfair Display", serif;
  font-size: 34px;
  font-weight: 600;
  color: #fff;
  margin: 20px 0 8px;
  letter-spacing: -0.5px;
}

p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 24px;
}

label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--subtle);
  text-transform: uppercase;
  margin: 16px 0 6px;
}
label small {
  color: var(--subtle);
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
}

input {
  width: 100%;
  padding: 13px 18px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: all .2s ease;
}
input:focus {
  border-color: var(--gold);
  background: rgba(255, 255, 255, 0.07);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 24px;
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--gold-gradient);
  color: #0b0b0e;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all .25s ease;
  box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25);
}
button:hover {
  box-shadow: var(--shadow-glow);
  transform: translateY(-2px);
}
button:disabled {
  opacity: .6;
  cursor: not-allowed;
  transform: none;
}

.msg {
  padding: 14px 16px;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.25);
  border-radius: var(--radius-sm);
  color: #f87171;
  margin-top: 18px;
  font-size: 13px;
  line-height: 1.5;
}

.links {
  margin-top: 24px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
}
.links a {
  color: var(--gold);
  text-decoration: none;
  font-weight: 600;
  transition: color .2s;
}
.links a:hover {
  text-decoration: underline;
  color: #fff;
}

@media (max-width: 480px) {
  .box { padding: 32px 24px; }
  h1 { font-size: 28px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <div class="logo">LAXMINARAYAN GROUP <span class="gold">•</span></div>
    <h1>Create your account.</h1>
    <p>Use an email, phone number, or both. Your password is securely encrypted.</p>
    
    <form id="form">
      <label>FULL NAME</label>
      <input id="name" autocomplete="name" placeholder="Himanshu Kanani" required>
      
      <label>EMAIL <small>(optional if phone is provided)</small></label>
      <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
      
      <label>PHONE <small>(optional if email is provided)</small></label>
      <input id="phone" type="tel" autocomplete="tel" placeholder="+91 9876543210">
      
      <label>PASSWORD</label>
      <input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="At least 8 characters" required>
      
      <button id="submit">CREATE ACCOUNT →</button>
    </form>
    
    <div id="msg" class="msg" style="display:none"></div>
    <div class="links">
      Already have an account? <a href="login.html">Log in</a> · <a href="index.html">Back to Website</a>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const returnTo = params.get("return_to");
const safeReturnTo = v => v && v.startsWith("/") && !v.startsWith("//") && !v.includes("\\") ? v : null;
const safeTarget = safeReturnTo(returnTo);

const form = document.getElementById("form");
const msg = document.getElementById("msg");
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const phoneInput = document.getElementById("phone");
const passwordInput = document.getElementById("password");
const submitBtn = document.getElementById("submit");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.style.display = "none";

  const nameValue = nameInput.value.trim();
  const emailValue = emailInput.value.trim();
  const phoneValue = phoneInput.value.trim();
  const passwordValue = passwordInput.value;

  if (nameValue.length < 2) {
    msg.textContent = "Enter your full name";
    msg.style.display = "block";
    nameInput.focus();
    return;
  }
  if (!emailValue && !phoneValue) {
    msg.textContent = "Enter an email or phone number";
    msg.style.display = "block";
    emailInput.focus();
    return;
  }
  if (passwordValue.length < 8) {
    msg.textContent = "Password must be 8–128 characters";
    msg.style.display = "block";
    passwordInput.focus();
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "CREATING ACCOUNT...";

  try {
    const r = await fetch("/api/auth/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        name: nameValue,
        email: emailValue,
        phone: phoneValue,
        password: passwordValue
      })
    });

    const d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.error || "Could not create account");

    window.location.replace(safeTarget || "index.html#projects");
  } catch (err) {
    msg.textContent = err.message || "Could not create account";
    msg.style.display = "block";
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "CREATE ACCOUNT →";
  }
});
</script>
</body>
</html>
