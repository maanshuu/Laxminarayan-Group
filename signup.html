<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laxminarayan Group — Client Registration</title>
<link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
<link rel="apple-touch-icon" href="assets/favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #f8fafc;
  --bg-surface: #ffffff;
  --bg-subtle: #f1f5f9;
  --bg-sky-tint: #f0f9ff;
  
  --sky-primary: #0284c7;
  --sky-deep: #0369a1;
  --sky-light: #e0f2fe;
  --sky-glow: rgba(2, 132, 199, 0.2);
  --sky-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
  
  --ink-heading: #0f172a;
  --ink-body: #334155;
  --ink-muted: #64748b;
  --ink-subtle: #94a3b8;
  
  --line: rgba(15, 23, 42, 0.08);
  --line-strong: rgba(15, 23, 42, 0.15);
  --line-sky: rgba(2, 132, 199, 0.25);
  
  --shadow-card: 0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
  --shadow-float: 0 20px 50px -10px rgba(15, 23, 42, 0.09);

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-pill: 9999px;
  
  --font-serif: "Playfair Display", Georgia, serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  margin: 0;
  background: var(--bg-main);
  color: var(--ink-body);
  font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(2, 132, 199, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 90% 80%, rgba(14, 165, 233, 0.05) 0%, transparent 40%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
  -webkit-font-smoothing: antialiased;
}

.box {
  width: min(460px, 100%);
  background: var(--bg-surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 44px 38px;
  box-shadow: var(--shadow-float);
  position: relative;
  overflow: hidden;
}

.box::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--sky-gradient);
}

.logo {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 2.5px;
  color: var(--ink-heading);
  display: flex;
  align-items: center;
  gap: 8px;
  text-transform: uppercase;
}
.sky-dot { color: var(--sky-primary); }

h1 {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 600;
  color: var(--ink-heading);
  margin: 18px 0 8px;
  letter-spacing: -0.5px;
}

p {
  color: var(--ink-muted);
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 24px;
}

label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--ink-muted);
  text-transform: uppercase;
  margin: 16px 0 6px;
}
label small {
  color: var(--ink-subtle);
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
}

input {
  width: 100%;
  padding: 13px 16px;
  background: var(--bg-main);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  color: var(--ink-heading);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: all .2s ease;
}
input:focus {
  border-color: var(--sky-primary);
  background: #fff;
  box-shadow: 0 0 0 3px var(--sky-glow);
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 24px;
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--sky-gradient);
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all .25s ease;
  box-shadow: 0 4px 16px var(--sky-glow);
}
button:hover {
  box-shadow: 0 8px 24px rgba(2, 132, 199, 0.35);
  transform: translateY(-2px);
}
button:disabled {
  opacity: .6;
  cursor: not-allowed;
  transform: none;
}

.msg {
  padding: 14px 16px;
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-radius: var(--radius-sm);
  color: #dc2626;
  margin-top: 18px;
  font-size: 13px;
  line-height: 1.5;
}

.links {
  margin-top: 24px;
  text-align: center;
  font-size: 13px;
  color: var(--ink-muted);
}
.links a {
  color: var(--sky-deep);
  text-decoration: none;
  font-weight: 600;
  transition: color .2s;
}
.links a:hover {
  text-decoration: underline;
  color: var(--sky-primary);
}

@media (max-width: 480px) {
  .box { padding: 32px 24px; }
  h1 { font-size: 28px; }
}
</style>
</head>
<body>
<div class="box">
  <div class="logo">LAXMINARAYAN GROUP <span class="sky-dot">•</span></div>
  <h1>Create your account.</h1>
  <p>Use an email, phone number, or both. Your credentials are fully encrypted.</p>
  
  <form id="form">
    <label for="name">FULL NAME</label>
    <input id="name" autocomplete="name" placeholder="Himanshu Kanani" required aria-label="Full Name">
    
    <label for="email">EMAIL <small>(optional if phone is provided)</small></label>
    <input id="email" type="email" autocomplete="email" placeholder="name@example.com" aria-label="Email">
    
    <label for="phone">PHONE <small>(optional if email is provided)</small></label>
    <input id="phone" type="tel" autocomplete="tel" placeholder="+91 9876543210" aria-label="Phone">
    
    <label for="password">PASSWORD</label>
    <input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="At least 8 characters" required aria-label="Password">
    
    <button id="submit">CREATE ACCOUNT →</button>
  </form>
  
  <div id="msg" class="msg" style="display:none"></div>
  <div class="links">
    Already have an account? <a href="login.html">Log in</a> · <a href="index.html">Back to Website</a>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const returnTo = params.get("return_to");
const safeReturnTo = v => v && v.startsWith("/") && !v.startsWith("//") && !v.includes("\\") ? v : null;
const safeTarget = safeReturnTo(returnTo);

const form = document.getElementById("form");
const msg = document.getElementById("msg");
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const phoneInput = document.getElementById("phone");
const passwordInput = document.getElementById("password");
const submitBtn = document.getElementById("submit");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.style.display = "none";

  const nameValue = nameInput.value.trim();
  const emailValue = emailInput.value.trim();
  const phoneValue = phoneInput.value.trim();
  const passwordValue = passwordInput.value;

  if (nameValue.length < 2) {
    msg.textContent = "Enter your full name";
    msg.style.display = "block";
    nameInput.focus();
    return;
  }
  if (!emailValue && !phoneValue) {
    msg.textContent = "Enter an email or phone number";
    msg.style.display = "block";
    emailInput.focus();
    return;
  }
  if (passwordValue.length < 8) {
    msg.textContent = "Password must be 8–128 characters";
    msg.style.display = "block";
    passwordInput.focus();
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "CREATING ACCOUNT...";

  try {
    const r = await fetch("/api/auth/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        name: nameValue,
        email: emailValue,
        phone: phoneValue,
        password: passwordValue
      })
    });

    const d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.error || "Could not create account");

    window.location.replace(safeTarget || "index.html#projects");
  } catch (err) {
    msg.textContent = err.message || "Could not create account";
    msg.style.display = "block";
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "CREATE ACCOUNT →";
  }
});
</script>
</body>
</html>
