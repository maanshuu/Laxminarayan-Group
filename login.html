<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laxminarayan Group — Log In</title><style>
body{margin:0;background:#f5f2eb;color:#171715;font-family:Arial,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:25px}.box{width:min(430px,100%);background:#fff;padding:38px;border:1px solid #ddd8ce;box-shadow:0 18px 60px #0001}.logo{font-weight:800;letter-spacing:2px}.gold{color:#b58a43}h1{font-family:Georgia,serif;font-size:40px;margin:25px 0 8px}p{color:#777;line-height:1.6}label{display:block;font-size:12px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid #d7d1c5;box-sizing:border-box;font:inherit}button{width:100%;padding:15px;margin-top:20px;border:0;background:#b58a43;color:#171715;font-weight:800;cursor:pointer}.msg{padding:11px;background:#f1ece3;margin-top:15px;font-size:13px}.links{margin-top:20px;text-align:center;font-size:13px}.links a{color:#9b7131;text-decoration:none;font-weight:700}

@media (max-width:600px){
  .wrap{padding:16px;align-items:start;padding-top:30px}
  .box{padding:25px 20px;width:100%;max-width:430px}
  h1{font-size:34px;line-height:1.08}
  input{font-size:16px}
  button{min-height:48px}
}
@media (max-width:360px){
  .wrap{padding:10px}
  .box{padding:20px 16px}
  h1{font-size:30px}
}

</style></head><body><div class="wrap"><div class="box"><div class="logo">LAXMINARAYAN GROUP <span class="gold">•</span></div><h1>Welcome back.</h1><p id="intro">Log in using your email or phone number.</p><form id="form"><label>EMAIL OR PHONE</label><input id="identifier" autocomplete="username" required><label>PASSWORD</label><input id="password" type="password" minlength="8" autocomplete="current-password" required><button id="submit">LOG IN</button></form><div id="msg" class="msg" style="display:none"></div><div class="links">Don't have an account? <a href="signup.html">Sign up</a> · <a href="index.html">Website</a></div></div></div><script>
const params=new URLSearchParams(location.search);
if (params.has("logged_out")) history.replaceState(null,"", "login.html");
const returnTo=params.get("return_to");
function safeReturnTo(v){return v && v.startsWith("/") && !v.startsWith("//") && !v.includes("\\") ? v : null;}
const safeTarget=safeReturnTo(returnTo);
if(safeTarget) document.getElementById("intro").textContent="Log in to continue to your project portfolio.";
const form=document.getElementById("form"),msg=document.getElementById("msg");
form.onsubmit=async e=>{e.preventDefault();msg.style.display="none";const btn=document.getElementById("submit");btn.disabled=true;try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({identifier:document.getElementById("identifier").value,password:document.getElementById("password").value})});let d;try{d=await r.json()}catch(_){throw Error("The website server returned an unexpected response. Restart START_BACKEND.bat and try again.")}if(!d.success)throw Error(d.error||"Unable to log in");location.href=d.user.role==="admin"?"admin.html":(safeTarget||"index.html#projects")}catch(err){msg.textContent=err instanceof TypeError?"Cannot reach the website server. Start START_BACKEND.bat, then open http://localhost:5000/login.html — do not open login.html directly.":err.message;msg.style.display="block"}finally{btn.disabled=false}};
</script></body></html>
