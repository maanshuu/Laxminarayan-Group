<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Laxminarayan Group — Project</title><style>
body{margin:0;background:#f5f2eb;color:#171715;font:14px Arial,sans-serif}header{background:#171715;color:#fff;padding:16px 5%}header a{color:#fff;text-decoration:none;letter-spacing:2px;font-weight:700}.wrap{width:min(1100px,92%);margin:30px auto}.hero{background:#111;color:#fff;min-height:360px;display:flex;align-items:end;padding:35px;box-sizing:border-box;background-size:cover;background-position:center}.hero h1{font:52px Georgia;margin:0 0 8px}.hero p{max-width:700px;line-height:1.7}.panel{background:#fff;border:1px solid #ddd8ce;padding:24px;margin-top:18px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.gallery img,.gallery video{width:100%;height:230px;object-fit:cover;background:#eee}.btn{border:0;background:#b58a43;color:#fff;padding:12px 16px;font-weight:700;cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form input,.form textarea{padding:11px;border:1px solid #ccc;font:inherit}.form textarea{grid-column:1/-1;min-height:80px}.muted{color:#666}@media(max-width:700px){.hero{min-height:300px;padding:22px}.hero h1{font-size:38px}.gallery{grid-template-columns:1fr}.gallery img,.gallery video{height:220px}.form{grid-template-columns:1fr}.form textarea{grid-column:1}}
</style></head><body><header><a href="index.html">LAXMINARAYAN GROUP</a></header><main class="wrap"><div id="hero" class="hero"><div><div id="cat" class="muted"></div><h1 id="title">Loading…</h1><p id="desc"></p></div></div><div class="panel"><h2>Project information</h2><p id="description"></p><p><b>Location:</b> <span id="location">—</span></p><p><b>Price:</b> <span id="price">—</span></p><p><b>Amenities:</b> <span id="amenities">—</span></p><div><button class="btn" id="interest">I’m Interested →</button> <span id="interestMsg" class="muted"></span></div></div><div class="panel"><h2>Project gallery</h2><div id="gallery" class="gallery"></div></div><div class="panel"><h2>Request a site visit</h2><p class="muted">Choose a preferred date and time. Our team will confirm it with you.</p><form id="visitForm" class="form"><input id="visitAt" type="datetime-local" required><textarea id="visitNotes" placeholder="Anything you would like us to know?"></textarea><div><button class="btn">REQUEST SITE VISIT →</button></div><span id="visitMsg" class="muted"></span></form></div></main><script>
const id=Number(new URLSearchParams(location.search).get('id'));const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function load(){if(!Number.isInteger(id)||id<1){location.replace('index.html#projects');return}const me=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});if(!me.ok){location.replace('login.html?return_to='+encodeURIComponent(location.pathname+location.search));return}const r=await fetch('/api/projects/'+id,{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok||!d.success){document.body.innerHTML='<main class="wrap"><div class="panel"><h2>Project not found</h2><a href="index.html#projects">Return to website</a></div></main>';return}const p=d.data;document.title='Laxminarayan Group — '+p.name;$('title').textContent=p.name;$('cat').textContent=p.category;$('desc').textContent=p.description;$('description').textContent=p.description;$('location').textContent=p.location||'Contact our team';$('price').textContent=p.price||'Contact our team';$('amenities').textContent=p.amenities||'Contact our team';$('hero').style.backgroundImage=`linear-gradient(90deg,rgba(0,0,0,.82),rgba(0,0,0,.2)),url('${String(p.image||'').replace(/'/g,'%27')}')`;$('gallery').innerHTML=(d.media||[]).map(x=>x.media_type==='video'?`<video controls preload="metadata" src="${esc(x.file_path)}"></video>`:`<img loading="lazy" src="${esc(x.file_path)}" alt="${esc(p.name)}">`).join('')||'<p class="muted">Project gallery coming soon.</p>';$('interest').onclick=async()=>{const b=$('interest');b.disabled=true;try{const rr=await fetch('/api/projects/'+id+'/interest',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'}});const dd=await rr.json();if(rr.status===401){location.href='login.html?return_to='+encodeURIComponent(location.pathname+location.search);return}if(!rr.ok||!dd.success)throw Error(dd.error||'Could not register interest');$('interestMsg').textContent=dd.already_registered?'Our team already has this request.':'Interest registered. Our team will contact you.';$('interest').textContent='Interest Registered ✓'}catch(e){b.disabled=false;$('interestMsg').textContent=e.message}};
$('visitForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{const rr=await fetch('/api/site-visits',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id:id,preferred_at:$('visitAt').value,notes:$('visitNotes').value})});const dd=await rr.json();if(rr.status===401){location.href='login.html?return_to='+encodeURIComponent(location.pathname+location.search);return}if(!rr.ok||!dd.success)throw Error(dd.error||'Could not request site visit');$('visitMsg').textContent='Site visit request received. You can track it from My Account.';e.target.reset()}catch(e){$('visitMsg').textContent=e.message}finally{btn.disabled=false}}}
load().catch(e=>console.error(e));
</script></body></html>
